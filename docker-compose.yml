services:
  api:
    build: .
    container_name: rentnearby_api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: RentNearBy
      Jwt__Audience: RentNearBy
      REDIS_URL: ${REDIS_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      AppLinks__PackageName: com.rentnearby.rentnearby
      AppLinks__Sha256Fingerprints__0: ${APP_LINKS_SHA256_FINGERPRINT}
      AppLinks__PlayStoreUrl: https://play.google.com/store/apps/details?id=com.rentnearby.rentnearby
      PLAY_SERVICE_ACCOUNT_JSON: ${PLAY_SERVICE_ACCOUNT_JSON}
      PLAY_ACCOUNT_ID_SALT: ${PLAY_ACCOUNT_ID_SALT}
      PlayBilling__PackageName: com.rentnearby.rentnearby
      PlayBilling__RtdnAudience: https://developerbymistake.tech/api/v1/payments/play/rtdn
      PlayBilling__RtdnServiceAccountEmail: ${PLAY_RTDN_SERVICE_ACCOUNT_EMAIL}
      IDENTITY_ENCRYPTION_KEY: ${IDENTITY_ENCRYPTION_KEY}
    ports:
      - "5000:5000"
